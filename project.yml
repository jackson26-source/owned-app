name: Owned

options:
  bundleIdPrefix: dev.macless
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    # DEVELOPMENT_TEAM is intentionally not set here - it's passed as a
    # build setting override on the xcodebuild command line in CI (from the
    # APPLE_TEAM_ID secret), so it never needs to be hardcoded into this
    # checked-in, publicly-diffable file.
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Owned:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/OwnedApp
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Owned
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "Owned uses your camera to scan receipts so you don't have to type in the details by hand."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIDeviceFamily:
          - 1
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.80246720305-m82i9sdohs1lcs3h3jl5tbja844366fq
    settings:
      base:
        PRODUCT_NAME: Owned
        PRODUCT_BUNDLE_IDENTIFIER: dev.macless.owned
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  # UI-test target used only by .github/workflows/screenshots.yml to drive
  # the app on a simulator and capture App Store Connect listing images.
  # Never signed, never archived, never shipped - it's a test bundle, not
  # part of the app.
  OwnedUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/OwnedUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.macless.owned.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Owned

# Explicit scheme so the OwnedUITests target actually runs under
# `xcodebuild test -scheme Owned`. Without this, XcodeGen's default
# auto-generated per-target scheme would build OwnedUITests but never
# wire it into the Owned scheme's Test action.
schemes:
  Owned:
    build:
      targets:
        Owned: all
        OwnedUITests: [test]
    test:
      config: Debug
      targets:
        - OwnedUITests
    run:
      config: Debug
    archive:
      config: Release

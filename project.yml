name: Owned

options:
  bundleIdPrefix: dev.macless
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    # DEVELOPMENT_TEAM is intentionally not set here - it's passed as a
    # build setting override on the xcodebuild command line in CI (from the
    # APPLE_TEAM_ID secret), so it never needs to be hardcoded into this
    # checked-in, publicly-diffable file.
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Owned:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/OwnedApp
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Owned
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Owned uses your camera to scan receipts so you don't have to type in the details by hand."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIDeviceFamily:
          - 1
    settings:
      base:
        PRODUCT_NAME: Owned
        PRODUCT_BUNDLE_IDENTIFIER: dev.macless.owned
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

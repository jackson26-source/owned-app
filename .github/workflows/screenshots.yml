name: Generate App Store screenshots

# Manually triggered only (workflow_dispatch) - unlike testflight.yml and
# simulator-build.yml, screenshots don't need regenerating on every push,
# only when the UI actually changes enough to be worth new App Store
# Connect listing images.
#
# How this works: OwnedUITests (see project.yml) is a real XCUITest
# target that launches the app with a UI_TESTING_SCREENSHOTS launch
# argument (see ItemStore.swift's screenshotModeLaunchArgument), which
# seeds a handful of realistic demo purchases into a private, throwaway
# JSON file instead of touching real on-device data. The test then taps
# through Dashboard/Items/Timeline and captures a full-screen screenshot
# per tab via XCTAttachment, which xcodebuild bundles into the .xcresult.
# This job extracts those PNGs out of the .xcresult with xcresulttool and
# uploads them as a workflow artifact - from there they can be downloaded
# and uploaded to App Store Connect by hand (screenshots are a one-time
# listing asset, not something to auto-publish straight from CI).
#
# Runs against an iPhone 16 Pro Max simulator (6.9" display) - the one
# screenshot size Apple actually requires for an iPhone-only app
# (TARGETED_DEVICE_FAMILY=1 in project.yml, confirmed against Apple's
# current screenshot-specifications doc); every smaller size Apple
# supports auto-scales down from this one, so a single device is enough
# for a first pass. If the exact device name below doesn't exist on the
# runner's simulator set, the "Show available simulators" step will list
# what does - swap the name in the destination string below and re-run.
#
# Extraction note (fixed 2026-08-25): earlier versions of this workflow
# hand-walked the JSON from `xcresulttool get test-results tests` looking
# for a "payloadRef" field to find screenshot attachments. That command
# only ever returns the coarse pass/fail test tree - no attachment data
# lives there in Xcode 16's schema - so the walk always found zero
# attachments and the job silently uploaded only a debug JSON, no PNGs.
# Fixed by switching to xcresulttool's dedicated `export attachments`
# subcommand (Xcode 16+), which is built for exactly this and writes
# every XCTAttachment plus a manifest.json describing which file belongs
# to which test/attachment name.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Owned.xcodeproj from project.yml
        run: xcodegen generate

      - name: Show available simulators (for debugging device-name drift)
        run: xcrun simctl list devices available

      - name: Run screenshot UI test on iPhone 16 Pro Max (6.9" display)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Owned.xcodeproj \
            -scheme Owned \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max,OS=latest' \
            -resultBundlePath "$RUNNER_TEMP/Screenshots.xcresult" \
            -only-testing:OwnedUITests/ScreenshotUITests/testCaptureAppStoreScreenshots \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Extract screenshots from .xcresult
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots-out"

          # Dedicated export path for XCTAttachment files (Xcode 16+). No
          # --test-id means "every attachment in the bundle" - we only ran
          # one test, so that's exactly the screenshots we want.
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/Screenshots.xcresult" \
            --output-path "$RUNNER_TEMP/screenshots-out"

          echo "----- raw export output -----"
          ls -la "$RUNNER_TEMP/screenshots-out"

          # Keep the coarse pass/fail tree as a debug artifact too - cheap
          # insurance if a future Xcode version changes the export format
          # again; the fix is then a quick look at this file rather than a
          # guess.
          xcrun xcresulttool get test-results tests \
            --path "$RUNNER_TEMP/Screenshots.xcresult" --format json \
            > "$RUNNER_TEMP/screenshots-out/_debug_test_results.json" || true

          # Rename exported files to something readable using manifest.json,
          # if xcresulttool wrote one (e.g. "testName_attachmentName.png"
          # instead of an opaque generated name).
          python3 - "$RUNNER_TEMP/screenshots-out" << 'PYEOF'
          import json, os, re, sys

          out_dir = sys.argv[1]
          manifest_path = os.path.join(out_dir, "manifest.json")
          if not os.path.exists(manifest_path):
              print("No manifest.json found - leaving exported filenames as-is")
              sys.exit(0)

          with open(manifest_path) as f:
              manifest = json.load(f)

          def safe(s):
              return re.sub(r"[^A-Za-z0-9._-]+", "_", s).strip("_")

          # The manifest's exact key names have shifted across Xcode point
          # releases, so probe a few plausible spots rather than hard-coding
          # one schema.
          entries = manifest if isinstance(manifest, list) else manifest.get("attachments", [])
          for entry in entries:
              exported_name = (
                  entry.get("exportedFileName")
                  or entry.get("filename")
                  or entry.get("fileName")
              )
              if not exported_name:
                  continue
              src = os.path.join(out_dir, exported_name)
              if not os.path.exists(src):
                  continue
              test_name = entry.get("testIdentifier") or entry.get("testName") or ""
              attachment_name = entry.get("name") or entry.get("attachmentName") or ""
              ext = os.path.splitext(exported_name)[1]
              label = safe(f"{test_name}_{attachment_name}") or safe(exported_name)
              dst = os.path.join(out_dir, f"{label}{ext}")
              if dst != src and not os.path.exists(dst):
                  os.rename(src, dst)
                  print(f"Renamed {exported_name} -> {os.path.basename(dst)}")
          PYEOF

          echo "----- contents of screenshots-out -----"
          ls -la "$RUNNER_TEMP/screenshots-out"

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: ${{ runner.temp }}/screenshots-out
          if-no-files-found: warn
          retention-days: 30

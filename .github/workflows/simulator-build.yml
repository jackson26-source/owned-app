name: Simulator build

# Phase 1 goal: prove the project actually builds on a real macOS runner.
# No signing, no certificates, no secrets involved — a simulator build
# doesn't need any of that, which is exactly why this is the first
# workflow to get right before anything TestFlight-related is added.
#
# This project is a Swift Package with an .iOSApplication product (see
# Package.swift for why), not a traditional .xcodeproj. That's a less
# common setup for xcodebuild to open directly, and this workflow was
# written without access to a Mac or the Swift toolchain to verify it —
# the first real run of this workflow on a real runner is the actual
# test. If `xcodebuild -list` below doesn't report a scheme named "Owned",
# that's the first thing to look at.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Show resolved schemes
        run: xcodebuild -list

      - name: Show available simulators
        run: xcrun simctl list devicetypes

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme Owned \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation

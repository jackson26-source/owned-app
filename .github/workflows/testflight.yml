name: Build and upload Owned to TestFlight

# Runs entirely on GitHub's free-for-public-repos macOS runners (this repo is
# private, so it uses the account's macOS minutes instead - same runner,
# same behavior). Triggers on every push to main; you can also run it by
# hand from the Actions tab (workflow_dispatch).
#
# Signing: this app is a plain SwiftPM .iOSApplication package (no real
# .xcodeproj), and that auto-generated target has two hard limitations
# proven out over several CI runs:
#   1. It flatly refuses manual code signing - xcodebuild errors with
#      "does not support provisioning profiles ... Set the provisioning
#      profile value to Automatic". Only CODE_SIGN_STYLE=Automatic works.
#   2. `xcodebuild archive` against this target never populates
#      Products/Applications or ApplicationProperties in the resulting
#      .xcarchive (confirmed via a diagnostic step, under both manual and
#      automatic signing) - so `xcodebuild -exportArchive` can never work
#      here; it fails with "IDEDistributionMethodManager ... Unknown
#      Distribution Error" no matter what ExportOptions.plist says.
#
# The workaround: skip archive/export entirely. Do a plain `xcodebuild
# build` with Automatic signing driven by an App Store Connect API key (so
# it's non-interactive, no Apple ID/2FA prompt), find the signed .app under
# DerivedData, hand-package it into a Payload/*.ipa, and upload that
# directly with altool. See TESTFLIGHT.md for the one-time secrets setup
# this depends on.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Package.swift ships with a placeholder team identifier (it's not
      # secret, but there's no reason to hardcode a real one into a
      # publicly-diffable manifest either). This swaps in the real value
      # from the APPLE_TEAM_ID secret at build time, every build.
      - name: Set the real Apple Team ID into Package.swift
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/REPLACE_WITH_APPLE_TEAM_ID/$APPLE_TEAM_ID/" Package.swift
          grep teamIdentifier Package.swift

      - name: Set up App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$API_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "AUTH_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          echo "----- signing-relevant build settings before build -----"
          xcodebuild -scheme Owned -configuration Release -showBuildSettings 2>/dev/null | grep -E "CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER" || true

          xcodebuild -scheme Owned \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            build

          echo "----- locating built .app -----"
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 -name "*.app" | head -n 1)
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find a built .app under DerivedData/Build/Products - the build likely failed or produced output somewhere unexpected."
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "----- codesign -dvvv on the built .app -----"
          codesign -dvvv "$APP_PATH"

          echo "----- embedded.mobileprovision inside the built .app (decoded) -----"
          if [ -f "$APP_PATH/embedded.mobileprovision" ]; then
            security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/embedded_profile.plist" 2>/dev/null && /usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/embedded_profile.plist" || echo "FAILED TO DECODE embedded.mobileprovision"
          else
            echo "::error::No embedded.mobileprovision found in the built .app - it will not be installable/uploadable."
            exit 1
          fi

      - name: Package .ipa
        run: |
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          (cd "$RUNNER_TEMP" && zip -qr "Owned.ipa" "Payload")
          echo "----- resulting .ipa -----"
          ls -la "$RUNNER_TEMP/Owned.ipa"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$AUTH_KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          xcrun altool --upload-app -f "$RUNNER_TEMP/Owned.ipa" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

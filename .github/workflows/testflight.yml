name: Build and upload Owned to TestFlight

# Runs entirely on GitHub's free-for-public-repos macOS runners (this repo is
# private, so it uses the account's macOS minutes instead — same runner,
# same behavior). Triggers on every push to main; you can also run it by
# hand from the Actions tab (workflow_dispatch).
#
# This mirrors the proven ios-testflight.yml pattern from the appledev
# (Citolex) repo, simplified for Owned: one target, no share extension, no
# App Group, and no Capacitor/CocoaPods/npm step since this is a plain
# SwiftPM .iOSApplication package. See TESTFLIGHT.md for the one-time setup
# this workflow depends on.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Package.swift ships with a placeholder team identifier (it's not
      # secret, but there's no reason to hardcode a real one into a
      # publicly-diffable manifest either). This swaps in the real value
      # from the APPLE_TEAM_ID secret at build time, every build.
      - name: Set the real Apple Team ID into Package.swift
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/REPLACE_WITH_APPLE_TEAM_ID/$APPLE_TEAM_ID/" Package.swift
          grep teamIdentifier Package.swift

      # ---- Code signing: everything below reads from GitHub Actions
      # secrets you set once in this repo's Settings > Secrets and
      # variables > Actions. See TESTFLIGHT.md for how to generate each of
      # these — several can be reused directly from the appledev (Citolex)
      # repo's own secrets, since they're account-level, not app-level.
      - name: Import signing certificate + provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/owned-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APP_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"

          echo "----- codesigning identities available in keychain -----"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

          echo "----- app.mobileprovision (decoded) -----"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision" > "$RUNNER_TEMP/app_profile.plist" 2>/dev/null || echo "FAILED TO DECODE app.mobileprovision"
          grep -A1 "<key>Name</key>" "$RUNNER_TEMP/app_profile.plist" || true
          grep -A1 "<key>UUID</key>" "$RUNNER_TEMP/app_profile.plist" || true
          grep -A3 "<key>TeamIdentifier</key>" "$RUNNER_TEMP/app_profile.plist" || true
          grep -A1 "<key>application-identifier</key>" "$RUNNER_TEMP/app_profile.plist" || true
          grep -A3 "<key>ExpirationDate</key>" "$RUNNER_TEMP/app_profile.plist" || true

      - name: Validate signing setup
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          check_profile() {
            local PLIST_PATH="$1"
            local EXPECTED_BUNDLE_ID="$2"
            local LABEL="$3"

            if [ ! -s "$PLIST_PATH" ]; then
              echo "::error::Couldn't decode $LABEL at all in the previous step. The matching _BASE64 secret is likely not a valid base64-encoded .mobileprovision file - re-check TESTFLIGHT.md (make sure you base64'd the .mobileprovision file itself, not the .cer or .p12)."
              return 1
            fi

            local PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PLIST_PATH" 2>/dev/null || echo "")
            local PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PLIST_PATH" 2>/dev/null || echo "")
            local PROFILE_BUNDLE_ID="${PROFILE_APP_ID#*.}"
            local PROFILE_EXPIRY=$(/usr/libexec/PlistBuddy -c "Print :ExpirationDate" "$PLIST_PATH" 2>/dev/null || echo "(couldn't read)")

            echo "$LABEL - Team ID: ${PROFILE_TEAM_ID:-(couldn't read)}"
            echo "$LABEL - Bundle ID: ${PROFILE_BUNDLE_ID:-(couldn't read)}"
            echo "$LABEL - Expires: $PROFILE_EXPIRY"

            local FAILED=0
            if [ -z "$PROFILE_TEAM_ID" ]; then
              echo "::warning::Couldn't read a Team ID out of $LABEL - skipping that check, but this usually means the profile didn't decode cleanly."
            elif [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
              echo "::error::$LABEL's Team ID ($PROFILE_TEAM_ID) doesn't match your APPLE_TEAM_ID secret ($APPLE_TEAM_ID). Find your real Team ID at developer.apple.com/account under Membership."
              FAILED=1
            fi

            if [ -z "$PROFILE_BUNDLE_ID" ]; then
              echo "::warning::Couldn't read a bundle ID out of $LABEL - skipping that check."
            elif [ "$PROFILE_BUNDLE_ID" != "$EXPECTED_BUNDLE_ID" ]; then
              echo "::error::$LABEL's bundle ID ($PROFILE_BUNDLE_ID) doesn't match the expected $EXPECTED_BUNDLE_ID. Double-check this profile was created for the right App ID in TESTFLIGHT.md."
              FAILED=1
            fi

            return $FAILED
          }

          OVERALL_FAILED=0
          check_profile "$RUNNER_TEMP/app_profile.plist" "dev.macless.owned" "app.mobileprovision" || OVERALL_FAILED=1

          if [ "$OVERALL_FAILED" = "1" ]; then
            echo "::error::Signing setup validation failed - stopping here so you get a specific reason instead of a generic xcodebuild failure. Fix the mismatch above, then push again."
            exit 1
          fi

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "----- signing-relevant build settings before archive -----"
          xcodebuild -scheme Owned -configuration Release -showBuildSettings 2>/dev/null | grep -E "CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER" || true

          xcodebuild -scheme Owned \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Owned.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Inspect archive metadata
        run: |
          echo "----- archive Info.plist (full) -----"
          /usr/libexec/PlistBuddy -c "Print" "$RUNNER_TEMP/Owned.xcarchive/Info.plist" || echo "FAILED TO READ ARCHIVE Info.plist"
          echo "----- embedded.mobileprovision inside the archived .app (decoded) -----"
          APP_PATH=$(find "$RUNNER_TEMP/Owned.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          echo "App path: $APP_PATH"
          if [ -n "$APP_PATH" ] && [ -f "$APP_PATH/embedded.mobileprovision" ]; then
            security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/embedded_profile.plist" 2>/dev/null && /usr/libexec/PlistBuddy -c "Print" "$RUNNER_TEMP/embedded_profile.plist" || echo "FAILED TO DECODE embedded.mobileprovision"
          else
            echo "No embedded.mobileprovision found in the archived .app"
          fi
          echo "----- codesign -dvvv on the archived .app -----"
          codesign -dvvv "$APP_PATH" || echo "codesign inspection failed"

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.macless.owned</key>
              <string>Owned App Store</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Owned.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

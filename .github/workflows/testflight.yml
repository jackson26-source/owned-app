name: Build and upload Owned to TestFlight

# Runs entirely on GitHub's free-for-public-repos macOS runners (this repo is
# private, so it uses the account's macOS minutes instead - same runner,
# same behavior). Triggers on every push to main; you can also run it by
# hand from the Actions tab (workflow_dispatch).
#
# Why this generates a real .xcodeproj instead of building Package.swift
# directly: this app started as a plain SwiftPM .iOSApplication package (no
# .xcodeproj at all), which was the right call when this was first written
# in a sandbox with no Xcode. But across many CI runs on a real macOS
# runner, that turned out to be a dead end for TestFlight specifically:
#   - `xcodebuild build` against the SwiftPM-generated scheme compiles the
#     raw executable but never wraps it into a proper .app bundle (no
#     Owned.app anywhere in DerivedData - just a bare Mach-O binary plus a
#     loose resource bundle).
#   - `xcodebuild archive` against the same scheme "succeeds" but never
#     populates Products/Applications or ApplicationProperties in the
#     resulting .xcarchive, under either manual or automatic signing - so
#     `xcodebuild -exportArchive` can never work; it fails with
#     "IDEDistributionMethodManager ... Unknown Distribution Error" no
#     matter what ExportOptions.plist says.
#   - This matches what other people hit doing the same thing: SwiftPM's
#     .iOSApplication product is meant to be opened and archived from
#     Xcode's own GUI, not driven headlessly via `xcodebuild` on CI.
#
# The fix: keep all the Swift source exactly as-is (it's totally ordinary
# SwiftUI/UIKit code with no SwiftPM-specific dependencies), and generate a
# real, standard .xcodeproj from it at build time with XcodeGen (see
# project.yml in the repo root). That gives `xcodebuild archive` /
# `-exportArchive` the normal project structure they expect, which is the
# well-documented, widely-used path for iOS TestFlight CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Owned.xcodeproj from project.yml
        run: |
          xcodegen generate
          ls -la Owned.xcodeproj

      - name: Set up App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$API_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "AUTH_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Automatic signing driven by the App Store Connect API key so this is
      # fully non-interactive (no Apple ID / 2FA prompt). Xcode creates or
      # reuses whatever certificate + provisioning profile it needs on its
      # own, using that API key's account access.
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild -project Owned.xcodeproj \
            -scheme Owned \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Owned.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Inspect archive metadata
        run: |
          echo "----- archive Info.plist (full) -----"
          /usr/libexec/PlistBuddy -c "Print" "$RUNNER_TEMP/Owned.xcarchive/Info.plist" || echo "FAILED TO READ ARCHIVE Info.plist"
          echo "----- embedded.mobileprovision inside the archived .app (decoded) -----"
          APP_PATH=$(find "$RUNNER_TEMP/Owned.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" 2>/dev/null | head -n 1)
          echo "App path: $APP_PATH"
          if [ -n "$APP_PATH" ] && [ -f "$APP_PATH/embedded.mobileprovision" ]; then
            security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/embedded_profile.plist" 2>/dev/null && /usr/libexec/PlistBuddy -c "Print" "$RUNNER_TEMP/embedded_profile.plist" || echo "FAILED TO DECODE embedded.mobileprovision"
          else
            echo "No embedded.mobileprovision found in the archived .app"
          fi

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Export .ipa
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Owned.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$AUTH_KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
